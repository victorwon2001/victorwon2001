name: Sync upstream signal

on:
  schedule:
    # GitHub's five-minute minimum, offset from the top-of-hour traffic peak.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-signal
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Synchronize
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: python scripts/update_profile.py

      - name: Commit changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "victorwon2001"
          git config user.email "192616110+victorwon2001@users.noreply.github.com"
          git add README.md assets/signal.svg
          git commit -m "sync: upstream signal"
          git push
